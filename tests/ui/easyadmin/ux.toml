# UX audit settings for easyadmin (read by `splk ux easyadmin` and the ux
# stage of `splk dev easyadmin`). See the splunk-ux skill.
#
# Both views follow the signed-in user's theme preference and reload
# themselves out of the other ?theme=, so the audit sets that preference for
# each pass and puts it back afterwards.

[views.role_management]
# The grid exists only once the role model has loaded and rendered.
ready = "#easyadmin-roles table.ea-table"
# The app's own content; Splunk Web's header and dashboard chrome are not ours to fix.
scope = "#easyadmin-roles"
settle_ms = 1500

[views.app_management]
# The app boxes exist only once the app model has loaded and rendered.
ready = "#easyadmin-apps .ea-grid"
scope = "#easyadmin-apps"
settle_ms = 1500

# The details panel of the first object in the search app (a built-in app,
# shown once "builtin" is ticked), with its settings list.
[[views.app_management.states]]
name = "details"
click = [
    '#easyadmin-apps input[data-fid="builtin"]',
    '#easyadmin-apps .ea-app[data-app="search"] .ea-object-name',
]
ready = "#easyadmin-apps .ea-panel .ea-settings"

# The refusal shown when staging would take one Apply over its size cap. The
# page's test hook lowers the cap so one bulk permission change exceeds it.
[[views.app_management.states]]
name = "cap-refusal"
query = "ea_max_request_bytes=30"
click = [
    '#easyadmin-apps input[data-fid="builtin"]',
    '#easyadmin-apps .ea-app[data-app="search"] .ea-select:not(:disabled)',
    '#easyadmin-apps button[data-fid="bulk-acl"]',
    '#easyadmin-apps input[data-fid="bulk-perms"]',
    '#easyadmin-apps button[data-fid="bulk-stage"]',
]
ready = "#easyadmin-apps .ea-panel-refusal"
