name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the PR base / push "before" commit and their merge
          # base exist locally. The default shallow clone has neither.
          fetch-depth: 0

      - name: Select apps changed by this PR or push
        id: find
        shell: bash
        env:
          # PR: diff against the base branch. Push: diff against the previous
          # tip. workflow_dispatch has neither, so it vets every app.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Only packaging and AppInspect are scoped; tests always run in full.
          # The script falls back to every app whenever the range is unusable
          # and when a shared file (packager, this workflow, waivers) changed.
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            apps="$(python3 scripts/changed_apps.py --all)"
          else
            apps="$(python3 scripts/changed_apps.py --base "${BASE_SHA}" --head "${HEAD_SHA}")"
          fi
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${apps}"
          if [ "${apps}" = "[]" ]; then
            echo "::notice::No app changed, so packaging and AppInspect were skipped."
          fi

  test:
    name: Tests (Python ${{ matrix.python }})
    # Pinned: ubuntu-latest moved to 26.04, for which actions/setup-python
    # publishes no 3.9 build (the newest 3.9.x ships for 22.04 and 24.04 only).
    # 3.9 is Splunk's LTS runtime, so the 3.9 leg must keep running.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is Splunk's LTS runtime and the fallback on 10.2+; 3.13 is the
        # opt-in runtime. commands.conf declares both, so both must pass.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile every app script and the dev tooling
        # Catches syntax that only parses on a newer interpreter. Without this,
        # a stray match statement or int | None annotation would sail through
        # review and fail at search time on the 3.9 runtime. tools/ and the
        # agent hooks run on developer machines with whatever Python
        # they have, so they are held to the same floor.
        run: python -m compileall -q apps/*/bin tools .claude/hooks

      - name: Run unit tests
        run: pytest -q

  package:
    name: Package ${{ matrix.app }}
    needs: [discover, test]
    # An empty matrix fails the run, so skip when no app changed.
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Build ${{ matrix.app }}.spl
        run: python scripts/package_app.py "${{ matrix.app }}" --outdir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.app }}-package
          path: dist/*.spl
          if-no-files-found: error

  appinspect:
    name: AppInspect ${{ matrix.app }}
    needs: [discover, package]
    # An empty matrix fails the run, so skip when no app changed.
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.app }}-package
          path: dist

      - name: Resolve package path
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          package="$(ls dist/*.spl | head -n 1)"
          echo "path=${package}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${package}"

      - name: AppInspect (complete check set)
        # No included_tags, so every check runs. Filtering to `cloud` covers 246
        # of 252, and the six it skips are where a Splunkbase-rejecting bug hid:
        # check_for_updates_disabled is tagged private_app, not cloud, so a
        # clean cloud run let a package through that Splunkbase refused.
        #
        # app_path must be the package FILE. Given a directory, the action's
        # entrypoint globs it and scans only the first entry.
        uses: splunk/appinspect-cli-action@799522990c6de011b56e4f58b20bdd293497aac2 # v2.15.0
        with:
          app_path: ${{ steps.pkg.outputs.path }}
          result_file: appinspect_${{ matrix.app }}.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.app }}-appinspect-report
          path: appinspect_${{ matrix.app }}.json
          if-no-files-found: warn

  appinspect-api:
    name: AppInspect API ${{ matrix.app }}
    needs: [discover, package]
    # An empty matrix fails the run, so skip when no app changed.
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for Splunk.com credentials
        id: creds
        shell: bash
        env:
          # The secrets context is unavailable in an `if:` expression, so it is
          # surfaced through env and tested here. Forks have no secrets, so the
          # job skips rather than failing for outside contributors.
          APPINSPECT_USER: ${{ secrets.SPLUNK_COM_USERNAME }}
        run: |
          if [ -n "${APPINSPECT_USER:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SPLUNK_COM_USERNAME is not set, so the AppInspect API vetting was skipped."
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.creds.outputs.available == 'true'
        with:
          name: ${{ matrix.app }}-package
          path: api-package

      - name: AppInspect API (authoritative Cloud vetting)
        if: steps.creds.outputs.available == 'true'
        uses: splunk/appinspect-api-action@86013a62b0c773d1e9cd4623080b4495973936c3 # v3.0.5
        with:
          username: ${{ secrets.SPLUNK_COM_USERNAME }}
          password: ${{ secrets.SPLUNK_COM_PASSWORD }}
          # A DIRECTORY holding exactly one package, unlike the CLI action above
          # which needs the file itself. This entrypoint runs `ls $app_path` and
          # appends the result, so a file path resolves to <file>/<file>.
          app_path: api-package
          # Unfiltered, matching the CLI step above.

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.creds.outputs.available == 'true'
        with:
          name: ${{ matrix.app }}-appinspect-api-report
          path: AppInspect_response.html
          if-no-files-found: warn
