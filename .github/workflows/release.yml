name: Release

# Apps are released individually, so tags name the app they belong to:
#   fillcontinuous-v1.0.0
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      app:
        description: "App directory under apps/ to package and vet"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve app name
        id: app
        shell: bash
        env:
          MANUAL_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_APP:-}" ]; then
            app="${MANUAL_APP}"
          else
            # fillcontinuous-v1.0.0 -> fillcontinuous
            app="${GITHUB_REF_NAME%-v*}"
          fi
          if [ ! -f "apps/${app}/default/app.conf" ]; then
            echo "::error::No app at apps/${app} (resolved from '${GITHUB_REF_NAME:-$MANUAL_APP}')"
            exit 1
          fi
          echo "name=${app}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${app}"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

      - name: Build package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_app.py "${{ steps.app.outputs.name }}" --outdir dist
          package="$(ls dist/*.spl | head -n 1)"
          echo "path=${package}" >> "$GITHUB_OUTPUT"

      - name: AppInspect (cloud checks, local CLI)
        uses: splunk/appinspect-cli-action@v2.15.0
        with:
          app_path: ${{ steps.build.outputs.path }}
          included_tags: cloud
          result_file: appinspect_cli.json

      - name: Check for Splunk.com credentials
        id: creds
        shell: bash
        env:
          # The secrets context is not available in an `if:` expression, so it
          # is surfaced through env and tested here instead.
          APPINSPECT_USER: ${{ secrets.SPLUNK_COM_USERNAME }}
        run: |
          if [ -n "${APPINSPECT_USER:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPLUNK_COM_USERNAME is not set, so the authoritative AppInspect API vetting was skipped. Add SPLUNK_COM_USERNAME and SPLUNK_COM_PASSWORD as repository secrets to enable it."
          fi

      - name: AppInspect API (authoritative Cloud vetting)
        if: steps.creds.outputs.available == 'true'
        uses: splunk/appinspect-api-action@v3.0.5
        with:
          username: ${{ secrets.SPLUNK_COM_USERNAME }}
          password: ${{ secrets.SPLUNK_COM_PASSWORD }}
          app_path: ${{ steps.build.outputs.path }}
          included_tags: "cloud"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ steps.app.outputs.name }}-appinspect-reports
          path: |
            appinspect_cli.json
            *.json
          if-no-files-found: warn

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ steps.build.outputs.path }}
          generate_release_notes: true
