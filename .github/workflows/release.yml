name: Release

# Apps are released individually, so tags name the app they belong to:
#   fillcontinuous-v1.0.0
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      app:
        description: "App directory under apps/ to package and vet"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: needed to find the previous release of this
          # app and to scope the changelog to its directory.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve app name and version
        id: app
        shell: bash
        env:
          MANUAL_APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_APP:-}" ]; then
            app="${MANUAL_APP}"
            tag_version=""
          else
            # fillcontinuous-v1.0.0 -> app=fillcontinuous, version=1.0.0
            app="${GITHUB_REF_NAME%-v*}"
            tag_version="${GITHUB_REF_NAME#${app}-v}"
          fi
          if [ ! -f "apps/${app}/default/app.conf" ]; then
            echo "::error::No app at apps/${app} (resolved from '${GITHUB_REF_NAME:-$MANUAL_APP}')"
            exit 1
          fi
          echo "name=${app}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${tag_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${app} (tag version: ${tag_version:-n/a})"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

      - name: Build package
        id: build
        shell: bash
        env:
          APP: ${{ steps.app.outputs.name }}
          TAG_VERSION: ${{ steps.app.outputs.tag_version }}
        run: |
          set -euo pipefail
          # Passing the tag's version makes the packager refuse to build when
          # app.conf disagrees. Without it, tagging v1.0.1 while app.conf still
          # says 1.0.0 publishes a 1.0.0 package under a 1.0.1 release.
          if [ -n "${TAG_VERSION}" ]; then
            python scripts/package_app.py "${APP}" --outdir dist --expect-version "${TAG_VERSION}"
          else
            python scripts/package_app.py "${APP}" --outdir dist
          fi
          package="$(ls dist/*.spl | head -n 1)"
          echo "path=${package}" >> "$GITHUB_OUTPUT"

      - name: AppInspect (cloud checks, local CLI)
        uses: splunk/appinspect-cli-action@v2.15.0
        with:
          app_path: ${{ steps.build.outputs.path }}
          included_tags: cloud
          result_file: appinspect_cli.json

      - name: Check for Splunk.com credentials
        id: creds
        shell: bash
        env:
          # The secrets context is not available in an `if:` expression, so it
          # is surfaced through env and tested here instead.
          APPINSPECT_USER: ${{ secrets.SPLUNK_COM_USERNAME }}
        run: |
          if [ -n "${APPINSPECT_USER:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SPLUNK_COM_USERNAME is not set, so the authoritative AppInspect API vetting was skipped. Add SPLUNK_COM_USERNAME and SPLUNK_COM_PASSWORD as repository secrets to enable it."
          fi

      - name: Stage the package for the API action
        if: steps.creds.outputs.available == 'true'
        run: |
          mkdir -p api-package
          cp "${{ steps.build.outputs.path }}" api-package/

      - name: AppInspect API (authoritative Cloud vetting)
        if: steps.creds.outputs.available == 'true'
        uses: splunk/appinspect-api-action@v3.0.5
        with:
          username: ${{ secrets.SPLUNK_COM_USERNAME }}
          password: ${{ secrets.SPLUNK_COM_PASSWORD }}
          # A DIRECTORY holding exactly one package, unlike the CLI action which
          # needs the file. This one's entrypoint runs `ls $app_path` and appends
          # the result, so a file path would resolve to <file>/<file>.
          app_path: api-package
          included_tags: "cloud"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ steps.app.outputs.name }}-appinspect-reports
          path: |
            appinspect_cli.json
            *.json
          if-no-files-found: warn

      - name: Build release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APP: ${{ steps.app.outputs.name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The previous release OF THIS APP, not whichever tag happened to be
          # cut last. GitHub's generate_release_notes uses the latter, so in a
          # monorepo it lists another app's commits.
          prev="$(git describe --tags --abbrev=0 --match "${APP}-v*" "${tag}^" 2>/dev/null || true)"
          {
            if [ -n "${prev}" ]; then
              changes="$(git log --no-merges --pretty='- %s' "${prev}..${tag}" -- "apps/${APP}/")"
              echo "Changes to \`${APP}\` since ${prev}:"
              echo
              if [ -n "${changes}" ]; then
                echo "${changes}"
              else
                echo "- No changes under \`apps/${APP}/\`; repackaged only."
              fi
              echo
              echo "[Full diff](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${prev}...${tag})"
            else
              echo "First release of \`${APP}\`."
            fi
            echo
            echo "Validated against Splunk AppInspect cloud checks before publishing."
          } > release_notes.md
          echo "----- notes -----"
          cat release_notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: ${{ steps.build.outputs.path }}
          body_path: release_notes.md
          # Deliberately off: it diffs against the previous release of ANY app.
          generate_release_notes: false
