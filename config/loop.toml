# Settings for `splk loop`, the roadmap loop. No secrets here: the ntfy topic
# (optional) is SPLK_NTFY_TOPIC in .env.

[claude]
# Path to the Claude Code CLI. Empty: SPLK_CLAUDE, then PATH, then the newest
# copy bundled with the VS Code extension.
path = ""
# Headless steps cannot answer permission prompts, so anything that would
# prompt is denied; the repo's hooks still guard every command.
permission_mode = "auto"
# Hours one step may run before it is killed and retried.
step_timeout_hours = 4

# One model per step. Judgement-heavy steps that read little (groom, plan,
# audit) get the strongest model; token-heavy steps (implement, review, fix,
# retro) get the efficient one, escalating only when they keep failing.
[models]
groom = "opus"
audit = "opus"
plan = "opus"
implement = "sonnet"
implement_escalated = "opus"
review = "sonnet"
retro = "sonnet"
fix = "sonnet"

[effort]
groom = "high"
audit = "high"
plan = "high"
implement = "high"
review = "medium"
retro = "medium"
fix = "high"

[limits]
# Implement + verify rounds per item before the loop stops and asks for help.
max_attempts = 4
# From this attempt on, implement uses models.implement_escalated.
escalate_after = 2
# Fix rounds per PR (CI failures and review feedback) before stopping.
max_fix_attempts = 3
# Plain errors (not usage limits) a step may hit in a row before stopping.
max_step_errors = 2
# Seconds between checks of an open PR or of unanswered questions.
poll_seconds = 300
# Notify after this many usage-limit retries in a row (~35 min of waiting).
notify_rate_limit_after = 3

[notify]
# Push notifications through ntfy (https://ntfy.sh, or a self-hosted server).
# Off unless SPLK_NTFY_TOPIC is set in .env; use a long random topic name.
server = "https://ntfy.sh"
