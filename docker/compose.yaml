# The roadmap loop on a server: a Splunk instance and the dev container that
# runs `splk loop` against it. From this directory, with .env filled in from
# .env.example:
#
#   docker compose up -d --build
#   docker compose logs -f dev
#   docker compose exec -u loop -w /work/splunk_apps dev splk loop status
#
# Splunk Web is published on SPLUNK_WEB_PORT for looking at the apps; splunkd
# (8089) is reachable only from the dev container.

name: splunk-apps

services:
  splunk:
    # Pin the exact version the apps are tested against (never :latest).
    image: ${SPLUNK_IMAGE:?set SPLUNK_IMAGE in .env, e.g. splunk/splunk:<exact version>}
    hostname: splunk
    restart: unless-stopped
    environment:
      # Licence and terms acceptance are the owner's to give, in .env.
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:?accept the licence in .env}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:-}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD in .env}
      # The free Developer licence: the Free licence turns off users and
      # roles, which the live and UI tests create and check.
      SPLUNK_LICENSE_URI: /licence/splunk.lic
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
      - ./licence:/licence:ro
      # splunkd installs the packages `splk deploy` stages here.
      - stage:/stage:ro
    ports:
      # Plain HTTP with the admin account: loopback by default. Set
      # SPLUNK_WEB_BIND to the server's LAN address to reach it from the LAN.
      - "${SPLUNK_WEB_BIND:-127.0.0.1}:${SPLUNK_WEB_PORT:-8000}:8000"

  dev:
    build:
      context: ..
      dockerfile: docker/dev/Dockerfile
    restart: unless-stopped
    depends_on:
      - splunk
    # An explicit list, never env_file: the Splunk admin password and image
    # settings in .env must not reach the loop. The entrypoint moves the
    # secrets out of reach of the steps (see docker/dev/entrypoint.sh).
    environment:
      SPLK_TARGET: docker   # config/targets.toml [targets.docker]
      REPO_URL: ${REPO_URL:?set REPO_URL in .env}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:?set GIT_AUTHOR_NAME in .env}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:?set GIT_AUTHOR_EMAIL in .env}
      GH_TOKEN: ${GH_TOKEN:?set GH_TOKEN in .env}
      SPLK_LOOP_GH_TOKEN: ${SPLK_LOOP_GH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?set CLAUDE_CODE_OAUTH_TOKEN in .env}
      SPLUNK_TOKEN: ${SPLUNK_TOKEN:-}
      SPLUNK_WEB_USERNAME: ${SPLUNK_WEB_USERNAME:-admin}
      SPLUNK_WEB_PASSWORD: ${SPLUNK_WEB_PASSWORD:-}
      SPLK_NTFY_TOPIC: ${SPLK_NTFY_TOPIC:-}
      SPLK_NTFY_TOKEN: ${SPLK_NTFY_TOKEN:-}
    # Root only long enough to hand the secrets to `loop` and drop to it.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    # A runaway step must not starve Splunk. Override in .env if needed.
    mem_limit: ${DEV_MEM_LIMIT:-8g}
    cpus: ${DEV_CPUS:-4}
    # In memory and root-owned (0711): the entrypoint hands the secrets to
    # the loop user here, where it cannot plant a symlink and nothing
    # reaches disk.
    tmpfs:
      - /run/loop-secrets:mode=0711,uid=0,gid=0,size=64k
    volumes:
      # The clone, its branches and .agent/ (loop state, run log) live here,
      # so a rebuilt image carries on where the loop stopped.
      - work:/work
      - stage:/stage
      # Claude Code's own settings and session history.
      - claude:/home/loop/.claude

volumes:
  splunk-etc:
  splunk-var:
  stage:
  work:
  claude:
