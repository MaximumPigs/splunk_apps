#
# easyadmin - app configuration
#
# [launcher] version and [id] version must be kept identical; AppInspect fails
# the package when they disagree.
#

[install]
state = enabled
# Must stay false. The app has no setup screen, and AppInspect fails
# check_that_setup_has_not_been_performed when this claims a setup already ran.
is_configured = false
# Splunk Web caches appserver/static files keyed on this number, so a change
# to the page's JS or CSS is not served until it is incremented (or the cache
# is bumped at /<locale>/_bump). Increment it with every such change.
build = 7

[package]
id = easyadmin
# check_for_updates is deliberately absent, which leaves it enabled.
# Splunkbase rejects an upload that disables it: it drives the update
# notifications Splunkbase itself serves. Do not set this to false on any app
# intended for Splunkbase, however tempting it looks for a private deployment.

[id]
name = easyadmin
version = 1.0.0

[launcher]
author = MaximumPigs
version = 1.0.0
description = An admin page for managing every role in one place: indexes, capabilities, inheritance and search limits, edited in bulk and saved at once.

[ui]
# Ships views, so it appears in the app menu and needs default nav XML.
is_visible = true

# Declares that the app works in both themes, so Splunk Web may apply each
# user's chosen theme (user-prefs.conf [general] theme) to it. This alone did
# not darken the Classic dashboard on 10.6.1: a Classic dashboard takes its
# theme from its own XML or a ?theme= URL parameter. So the page also reloads
# itself with ?theme=<preference> when Splunk drew the other theme (see
# appserver/static/easyadmin_roles.js).
supported_themes = light,dark

# Must match the Splunkbase display name exactly. Splunkbase requires the
# listing name to correspond to this label, and the name itself must follow
# their pattern:
#
#   (Company | Brand | Author) [solution name] (App | Add-on | Connector)
#
# so it starts with the author, not the solution. "App" rather than "Add-on"
# because this ships views.
# If you change this, change app.manifest info.title and the Splunkbase
# listing in the same commit.
label = MaximumPigs Easy Admin App
