#
# easyadmin - expose the app's REST endpoint through Splunk Web
#
# The page runs in the browser, which can only reach splunkd through Splunk
# Web's proxy (/splunkd/__raw/services/...). The proxy forwards only endpoints
# that are explicitly exposed, so without this stanza the page gets a 404.
# Splunk Web still requires a logged-in session and, for POST, its CSRF token.
#

[expose:easyadmin_roles]
pattern = easyadmin/roles
methods = GET, POST
