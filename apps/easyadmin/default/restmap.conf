#
# easyadmin - REST endpoint behind the index permissions page
#
# Served by splunkd at /services/easyadmin/index_permissions. The browser
# reaches it through Splunk Web's proxy, which default/web.conf opens.
#
# passSystemAuth is deliberately left at its default (false): the handler is
# given the calling user's own session token and nothing stronger, so every
# read and write it makes is authorised by splunkd as that user.
#
# Both Python settings are declared on purpose:
#
#   python.version   read by Splunk 10.0 and 10.1, and required by AppInspect's
#                    Cloud checks. Deprecated from 10.2 onward.
#   python.required  read by Splunk Enterprise and Cloud 10.2+, which picks the
#                    highest listed version available. Listing 3.9 as well as
#                    3.13 keeps the handler working on the 3.9 LTS runtime.
#

[script:easyadmin_index_permissions]
match = /easyadmin/index_permissions
script = easyadmin_rest.py
scripttype = persist
handler = easyadmin_rest.IndexPermissionsHandler
requireAuthentication = true
output_modes = json
# The page posts a JSON document, so the handler needs the raw request body.
passPayload = true
python.version = python3
python.required = 3.9, 3.13
