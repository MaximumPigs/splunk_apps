#
# easyadmin - REST endpoint behind the role management page
#
# Served by splunkd at /services/easyadmin/roles. The browser
# reaches it through Splunk Web's proxy, which default/web.conf opens.
#
# passSystemAuth is deliberately left at its default (false): the handler is
# given the calling user's own session token and nothing stronger, so every
# read and write it makes is authorised by splunkd as that user.
#
# Both Python settings are declared on purpose:
#
#   python.version   read by Splunk 10.0 and 10.1, and required by AppInspect's
#                    Cloud checks. Deprecated from 10.2 onward.
#   python.required  read by Splunk Enterprise and Cloud 10.2+, which picks the
#                    highest listed version available. Listing 3.9 as well as
#                    3.13 keeps the handler working on the 3.9 LTS runtime.
#

[script:easyadmin_roles]
match = /easyadmin/roles
script = easyadmin_rest.py
scripttype = persist
handler = easyadmin_rest.RolesHandler
requireAuthentication = true
output_modes = json
# The page posts a JSON document, so the handler needs the raw request body.
passPayload = true
python.version = python3
python.required = 3.9, 3.13

# App management page: lists apps and their knowledge objects, and moves,
# re-permissions and deletes them. Same settings as the role endpoint, for the
# same reasons.
[script:easyadmin_apps]
match = /easyadmin/apps
# Its own script: splunkd refuses a persist script defining two handler classes.
script = easyadmin_apps_rest.py
scripttype = persist
handler = easyadmin_apps_rest.AppsHandler
requireAuthentication = true
output_modes = json
passPayload = true
python.version = python3
python.required = 3.9, 3.13

# Configuration precedence view: reads .conf files read-only, as btool does,
# because REST returns only merged values. GET only. Restricted to callers
# holding admin_all_objects here and again in easyadmin_conf_core.
[script:easyadmin_conf]
match = /easyadmin/conf
script = easyadmin_conf_rest.py
scripttype = persist
handler = easyadmin_conf_rest.ConfHandler
requireAuthentication = true
capability = admin_all_objects
output_modes = json
python.version = python3
python.required = 3.9, 3.13
