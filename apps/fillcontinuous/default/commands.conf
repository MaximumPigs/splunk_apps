#
# fillcontinuous - custom search command registration
#
# Both Python settings are declared on purpose:
#
#   python.version   read by Splunk 10.0 and 10.1, and required by AppInspect's
#                    Cloud checks. Deprecated from 10.2 onward.
#   python.required  read by Splunk Enterprise and Cloud 10.2+, which picks the
#                    highest listed version available. Listing 3.9 as well as
#                    3.13 keeps the command working on the 3.9 LTS runtime,
#                    which remains the default and the fallback.
#
# The command code and the vendored splunklib both run on 3.9 and 3.13. The
# bundled SDK is 3.0.0 with its ai/ subpackage removed: that subpackage is the
# only part using Python 3.10+ syntax, and a search command has no use for it.
# Do not narrow this to 3.13 alone without also dropping 3.9 support.
#

[fillcontinuous]
filename = fillcontinuous.py
chunked = true
python.version = python3
python.required = 3.9, 3.13

# Terse alias for interactive searching. Same script, same behaviour.
[fillgaps]
filename = fillcontinuous.py
chunked = true
python.version = python3
python.required = 3.9, 3.13
