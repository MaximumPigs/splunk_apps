#
# fillcontinuous - app configuration
#
# [launcher] version and [id] version must be kept identical; AppInspect fails
# the package when they disagree.
#

[install]
state = enabled
is_configured = true
build = 1

[package]
id = fillcontinuous
check_for_updates = false

[id]
name = fillcontinuous
version = 1.0.0

[launcher]
author = Max
version = 1.0.0
description = Fills the missing time buckets that timechart and makecontinuous cannot, across any number of group-by fields.

[ui]
# Search-command-only add-on: no views, so it stays out of the app menu and no
# nav XML is required.
is_visible = false
label = Fill Continuous
