#
# fillcontinuous - search assistant syntax and help
#

[fillcontinuous-command]
syntax = fillcontinuous (span=<span>)? (fillvalue=<string>)? (marker=<field>)? (start=<epoch>)? (end=<epoch>)? (maxbuckets=<int>)? (maxrows=<int>)? (by)? <field-list>
alias = fillgaps
shortdesc = Fills missing time buckets across multiple group-by fields.
description = Adds a row for every combination of time bucket and group-by \
    values that is absent from the results, so each series is continuous. \
    This is what timechart does for a single split-by field. makecontinuous \
    cannot do it either: it fills along one dimension and has no concept of \
    group-by fields, so given multi-dimensional results it silently inserts \
    one valueless row per missing bucket instead of one row per series. \
    Run it after the data has been binned, typically after bin plus stats. \
    Synthesised rows take fillvalue (0 by default) for every aggregate field; \
    the group-by values and _time are set to the bucket they represent. \
    The bucket grid is anchored on the timestamps present in the results, so \
    real rows are never moved, duplicated or misaligned, including across \
    daylight-saving transitions. \
    span accepts fixed-width units only (ms, cs, ds, s, m, h, d, w). Calendar \
    units such as mon and y are rejected rather than approximated. When span \
    is omitted it is inferred from the most common gap between buckets. \
    start and end are epoch seconds that extend the grid beyond the observed \
    data, for leading and trailing buckets that contain no events at all. \
    marker names a field to add, set to 1 on synthesised rows and 0 on real \
    ones. \
    maxbuckets caps the number of time buckets and maxrows caps the rows \
    produced, which is buckets multiplied by series. Both default to their \
    maximum, 100000 and 1000000, and can be lowered but not raised.
comment1 = Fill hourly gaps for every host and sourcetype pair.
example1 = index=web | bin _time span=1h | stats count by _time, host, sourcetype | fillcontinuous span=1h by host, sourcetype
comment2 = Infer the span, and flag which rows were manufactured.
example2 = index=web | bin _time span=5m | stats sum(bytes) as bytes by _time, host, status | fillcontinuous marker=was_filled by host, status
comment3 = Cover the whole search window, not just the range that contained events.
example3 = index=web | bin _time span=1h | stats count by _time, host, sourcetype | fillcontinuous span=1h start=1767225600 end=1767312000 by host, sourcetype
usage = public
related = timechart, makecontinuous, fillnull, bin, stats
tags = fillcontinuous fillgaps timeseries gaps continuous

[fillgaps-command]
syntax = fillgaps (span=<span>)? (fillvalue=<string>)? (marker=<field>)? (start=<epoch>)? (end=<epoch>)? (maxbuckets=<int>)? (maxrows=<int>)? (by)? <field-list>
shortdesc = Alias for fillcontinuous.
description = Shorthand name for the fillcontinuous command. Identical syntax \
    and behaviour; see fillcontinuous for the full description.
comment1 = Fill hourly gaps for every host and sourcetype pair.
example1 = index=web | bin _time span=1h | stats count by _time, host, sourcetype | fillgaps span=1h by host, sourcetype
usage = public
related = fillcontinuous, timechart, makecontinuous, fillnull, bin
tags = fillcontinuous fillgaps timeseries gaps continuous
